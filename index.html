<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Codefolio | Kim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300..700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="profile">
    <div class="container">

        <!-- Profile -->
        <section class="profile-card">
            <div class="row align-items-center g-4">

                <div class="col-md-4 text-center">
                    <img src="atom.png" alt="รูปโปรไฟล์" class="profile-photo">
                </div>

                <div class="col-md-8">
                    <span class="badge-custom">Portfolio</span>
                    <h1 class="profile-name">Namchai deeme</h1>
                    <p class="profile-sub">นักเรียนชั้นมัธยมศึกษาปีที่ 6</p>

                    <div class="info-list">
                        <div class="info-item">
                            <span>โรงเรียน</span>
                            <strong>โรงเรียนวัดราชโอรส</strong>
                        </div>
                        <div class="info-item">
                            <span>อายุ</span>
                            <strong>17 ปี</strong>
                        </div>
                        <div class="info-item">
                            <span>กิจกรรมที่ชอบ</span>
                            <strong>เตะบอล</strong>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Works -->
        <section class="works">

            <div class="section-heading">
                <h2>ผลงานที่ภูมิใจ</h2>
                <p>สิ่งที่ฉันชื่นชอบและอยากนำเสนอ</p>
            </div>

            <div class="row g-3 g-md-4">

                <div class="col-6 col-md-3">
                    <div class="work-card">
                        <img src="angry-bird-angry-bird-red.png" alt="Angry Birds Red">
                        <h3>Red Bird</h3>
                    </div>
                </div>

                <div class="col-6 col-md-3">
                    <div class="work-card">
                        <img src="angry-birds-red.png" alt="Angry Birds">
                        <h3>Angry Birds</h3>
                    </div>
                </div>

                <div class="col-6 col-md-3">
                    <div class="work-card">
                        <img src="dlfei8jnk2dg1.png" alt="Angry Birds Character">
                        <h3>My Favorite</h3>
                    </div>
                </div>

                <div class="col-6 col-md-3">
                    <div class="work-card">
                        <img src="angry-bird-listening.png" alt="Angry Bird Listening">
                        <h3>Listening Bird</h3>
                    </div>
                </div>

            </div>

        </section>

    </div>
</header>

</body>
</html>
